apiVersion: apps/v1
kind: Deployment
metadata:
  name: parfumes-api
  namespace: k8s-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: parfumes-api
  template:
    metadata:
      labels:
        app: parfumes-api
    spec:
      containers:
        - name: parfumes-api
          image: parfumes-api-node:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: parfumes-api-config
            - secretRef:
                name: parfumes-api-secret
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
